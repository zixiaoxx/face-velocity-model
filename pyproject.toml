[project]
name = "face-velocity-model"
version = "0.1.0"
description = "Reproducible face-identity association and submission counting pilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "insightface==2.1",
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
    "onnxruntime>=1.20,<2",
    "opencv-python>=4.10,<5",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.20,<1",
    "scikit-learn>=1.5,<2",
    "uvicorn>=0.30,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "E501"]
